<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--PRIMARY SEO META TAGS -->
    <title>Virtual Trade Sandbox — Practice Stock Trading Risk-Free</title>

    <!-- Canonical URL (update to your production domain) -->
